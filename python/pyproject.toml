[project]
name = "durations"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
    "mutmut",
    "vulture",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durations"]

# ---------- ruff: everything on, opt out explicitly ----------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # project rule: no docstrings
    "COM812",  # conflicts with formatter
    "ISC001",  # conflicts with formatter
    "CPY",     # copyright headers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the point of tests
    "PLR2004", # literal expected values are fine in tests
    "INP001",  # tests/ is not a package
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 4
max-statements = 40

# ---------- pyright: strict ----------
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests"]
reportUnnecessaryTypeIgnoreComment = "error"

# ---------- tests + coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["durations"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

# ---------- mutation testing ----------
[tool.mutmut]
source_paths = ["src/"]
